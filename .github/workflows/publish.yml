name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish with --dry-run and upload nothing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' (v${tag_version}) does not match package version '${pkg_version}'."
            exit 1
          fi
      - name: Run tests
        run: node test/capability.test.mjs
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Publish to npm
        run: |
          dry_run="${{ inputs.dry_run }}"
          if [ "$dry_run" = "true" ]; then
            echo "dry run: no package will be uploaded"
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
